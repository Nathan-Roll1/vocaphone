name: Fourier catalog Android compilation and tests
on:
  push:
    branches: [qa/fourier-verification]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-android
      - run: python3 tools/model-pins/check_catalogs.py
      - working-directory: android
        run: ./gradlew :app:testFullDebugUnitTest --no-daemon
